<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Constants ───────────────────────────────────────────

const GEMINI_MODEL = 'gemini-2.0-flash';
const GEMINI_URL = () => `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${getApiKey()}`;

// ─── Icons ───────────────────────────────────────────────

    case 'note': return <svg {...c}><path d="M5 4h10l4 4v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5M8 13h8M8 17h6"/></svg>;

    case 'trash': return <svg {...c}><path d="M4 7h16M9 7V4h6v3M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>;
    case 'replay': return <svg {...c}><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>;
    case 'play': return <svg {...c}><path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/></svg>;
    case 'edit': return <svg {...c}><path d="M4 20h4l11-11-4-4L4 16z"/><path d="M14 6l4 4"/></svg>;
    case 'hash': return <svg {...c}><path d="M5 9h14M5 15h14M10 4l-2 16M16 4l-2 16"/></svg>;
    case 'lightning': return <svg {...c}><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>;
    case 'file': return <svg {...c}><path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>;
    case 'pdf': return <svg {...c}><path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><text x="8.5" y="17" fontSize="6" fontWeight="700" stroke="none" fill="currentColor">PDF</text></svg>;
    case 'text': return <svg {...c}><path d="M4 6h16M4 12h16M4 18h10"/></svg>;
    case 'flame': return <svg {...c}><path d="M12 3c1 3 4 4 4 8a4 4 0 1 1-8 0c0-2 1-3 1-5 1 1 2 1 3-3z"/></svg>;
    case 'bookmark': return <svg {...c}><path d="M6 3h12v18l-6-4-6 4z"/></svg>;
    case 'key': return <svg {...c}><circle cx="8" cy="15" r="4"/><path d="M11.5 11.5l6.5-6.5M16 5l2 2M18 7l2 2"/></svg>;
    case 'settings': return <svg {...c}><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>;
    case 'eye': return <svg {...c}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
    case 'eye-off': return <svg {...c}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>;
    case 'copy': return <svg {...c}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
    case 'link': return <svg {...c}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>;
    case 'info': return <svg {...c}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;

};

// ─── Storage ─────────────────────────────────────────────
const loadStore = () => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { sets: [], mistakes: [] }; }
  catch { return { sets: [], mistakes: [] }; }
};
const saveStore = (s) => localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
const getApiKey = () => localStorage.getItem(API_KEY_STORAGE) || '';
const setApiKey = (k) => localStorage.setItem(API_KEY_STORAGE, k);

// ─── PDF text extraction ──────────────────────────────────
async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  const pageCount = Math.min(pdf.numPages, 30);
  for (let i = 1; i <= pageCount; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n\n';
  }
  return { text: text.trim(), pages: pdf.numPages };
}

// ─── Gemini API call ─────────────────────────────────────
async function callClaude(prompt, apiKey) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 8192 },
    }),
  });

  if (!res.ok) {
    let errMsg = `HTTP ${res.status}`;
    try {
      const err = await res.json();
      errMsg = err.error?.message || errMsg;
    } catch (_) {}
    if (res.status === 400 || res.status === 403) throw new Error('API 키가 올바르지 않아요. 다시 확인해주세요. (' + errMsg + ')');
    if (res.status === 429) throw new Error('요청 한도 초과 (' + errMsg + ')');
    throw new Error('API 오류 (' + res.status + '): ' + errMsg);
  }

  const data = await res.json();
  return data.candidates[0].content.parts[0].text;
}

// ─── Question generation ──────────────────────────────────
async function generateQuestions({ source, types, difficulty, count, apiKey }) {
  const typeLabels = { ox: 'OX(참/거짓)', mc: '4지선다 객관식', fill: '빈칸 채우기', short: '단답형' };
  const selectedTypes = types.filter(t => t.selected).map(t => typeLabels[t.id]).join(', ');
  const diffMap = { easy: '쉬움(기본 개념 확인)', med: '보통(이해와 적용)', hard: '어려움(심화·응용)' };

  const prompt = `당신은 한국 대학교 시험 출제자입니다. 아래 학습 자료를 바탕으로 시험 문제를 만들어주세요.

[학습 자료]
${source.slice(0, 8000)}

[요청 사항]
- 문제 유형: ${selectedTypes}
- 난이도: ${diffMap[difficulty]}
- 총 문항 수: ${count}개
- 출제는 자료 내용에 충실하되, 핵심 개념 위주로
- 각 문제마다 명확한 정답과 한국어 해설을 포함
- 객관식 보기는 반드시 4개, 정답 번호는 1~4 숫자로

반드시 아래 JSON 형식으로만 응답하세요. 다른 설명 없이 JSON만 출력하세요.
{
  "questions": [
    {
      "type": "ox" | "mc" | "fill" | "short",
      "question": "문제 텍스트",
      "choices": ["보기1", "보기2", "보기3", "보기4"],
      "answer": "정답 (mc는 1~4 숫자, ox는 O 또는 X, fill/short는 정답 문자열)",
      "explanation": "한 줄 해설"
    }
  ]
}`;

  const raw = await callClaude(prompt, apiKey);
  const cleaned = raw.replace(/```json\s*/g, '').replace(/```\s*$/g, '').trim();
  const parsed = JSON.parse(cleaned);
  if (!parsed.questions || !Array.isArray(parsed.questions)) throw new Error('문제 형식이 올바르지 않아요.');
  return parsed.questions;
}

// ─── Toast ────────────────────────────────────────────────
let _showToast = null;
function Toast() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    _showToast = (msg, type = '') => {
      const id = Date.now();
      setToasts(t => [...t, { id, msg, type }]);
      setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
    };
  }, []);
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={'toast ' + t.type}>{t.msg}</div>
      ))}
    </div>
  );
}

function App() {
  const [apiKey, setApiKeyState] = useState(getApiKey);
  const [route, setRoute] = useState('home');
  const [store, setStore] = useState(loadStore);
  const [pendingSource, setPendingSource] = useState(null);
  const [activeSet, setActiveSet] = useState(null);
  const [results, setResults] = useState(null);

  const handleApiKeySaved = (k) => setApiKeyState(k);

  const updateStore = (patch) => {
    const next = typeof patch === 'function' ? patch(store) : { ...store, ...patch };
    setStore(next);
    saveStore(next);
  };

  const go = (r) => { setRoute(r); window.scrollTo(0, 0); };

  const handleChangeKey = () => {
    if (confirm('API 키를 변경하시겠어요?')) {
      localStorage.removeItem(API_KEY_STORAGE);
      setApiKeyState('');
    }
  };

  if (!apiKey) {
    return (
      <>
        <ApiKeyScreen onSave={handleApiKeySaved} />
        <Toast />
      </>
    );
  }

  return (
    <>
      <div className="app">
        <Appbar route={route} go={go} onChangeKey={handleChangeKey} />
        <main style={{ flex: 1 }}>
          {route === 'home'     && <HomeScreen store={store} go={go} setActiveSet={setActiveSet} />}
          {route === 'upload'   && <UploadScreen go={go} setPendingSource={setPendingSource} />}
          {route === 'settings' && <SettingsScreen go={go} pendingSource={pendingSource} updateStore={updateStore} setActiveSet={setActiveSet} apiKey={apiKey} />}
          {route === 'quiz'     && activeSet && <QuizScreen set={activeSet} go={go} setResults={setResults} updateStore={updateStore} />}
          {route === 'result'   && results && <ResultScreen results={results} set={activeSet} go={go} />}
          {route === 'mistakes' && <MistakesScreen store={store} updateStore={updateStore} go={go} />}
        </main>
        <MobileTabs route={route} go={go} />
      </div>
      <Toast />
    </>
  );
}

// ─── UPLOAD ───────────────────────────────────────────────
function UploadScreen({ go, setPendingSource }) {
  const [tab, setTab] = useState('pdf');
  const [file, setFile] = useState(null);
  const [extracting, setExtracting] = useState(false);
  const [extracted, setExtracted] = useState(null);
  const [error, setError] = useState(null);
  const [pasted, setPasted] = useState('');
  const [title, setTitle] = useState('');
  const [isDragging, setIsDragging] = useState(false);
  const inputRef = useRef(null);

  const handleFile = async (f) => {
    if (!f) return;
    setError(null);
    if (f.type !== 'application/pdf') { setError('PDF 파일만 지원합니다. 이미지는 텍스트 입력 탭을 사용해주세요.'); return; }
    setFile(f); setExtracting(true);
    try {
      const result = await extractPdfText(f);
      if (!result.text || result.text.length < 50) {
        setError('PDF에서 텍스트를 거의 추출하지 못했어요. 스캔본이라면 텍스트를 직접 붙여넣어주세요.');
        setExtracted(null);
      } else {
        setExtracted(result);
        if (!title) setTitle(f.name.replace(/\.pdf$/i, ''));
      }
    } catch (e) { setError('PDF 처리 중 오류: ' + e.message); }
    finally { setExtracting(false); }
  };

  const onDrop = (e) => { e.preventDefault(); setIsDragging(false); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

  const proceed = () => {
    let source, finalTitle;
    if (tab === 'pdf' && extracted) {
      source = extracted.text;
      finalTitle = title || file.name.replace(/\.pdf$/i, '');
    } else if (tab === 'text' && pasted.trim().length >= 50) {
      source = pasted.trim();
      finalTitle = title || '학습 자료 ' + new Date().toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
    } else {
      setError(tab === 'pdf' ? '먼저 PDF를 업로드해주세요.' : '학습 내용을 50자 이상 붙여넣어주세요.');
      return;
    }
    setPendingSource({ text: source, title: finalTitle, pages: extracted?.pages });
    go('settings');
  };

  const ready = (tab === 'pdf' && extracted) || (tab === 'text' && pasted.trim().length >= 50);

  return (
    <div className="container" style={{ padding: '32px 20px 80px' }}>
      <Stepper active={1} />
      <div style={{ marginBottom: 20 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, margin: '0 0 6px', letterSpacing: '-0.025em' }}>학습 자료 입력</h1>
        <p style={{ fontSize: 14, color: 'var(--ink-500)', margin: 0 }}>강의 PDF를 업로드하거나 노트 텍스트를 직접 붙여넣을 수 있어요.</p>
      </div>

      {/* Tabs */}
      <div style={{ display: 'flex', gap: 4, padding: 4, background: 'var(--ink-100)', borderRadius: 12, marginBottom: 16, width: 'fit-content' }}>

            <div style={{ display: 'flex', alignItems: 'center', gap: 14, textAlign: 'left' }}>
              <div style={{ width: 48, height: 48, borderRadius: 12, background: '#fef2f2', color: '#dc2626', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                <Ic name="pdf" size={22} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>

                  </span>

                <Ic name="trash" size={16} />

          </div>
        </div>
      )}

      {/* Title */}
      {ready && (
        <div className="card" style={{ padding: 20, marginTop: 14 }}>
          <label style={{ fontSize: 13, fontWeight: 600, color: 'var(--ink-700)', display: 'block', marginBottom: 8 }}>제목 (선택)</label>

      {error && (
        <div style={{ marginTop: 14, padding: 14, background: '#fef2f2', border: '1px solid #fecaca', borderRadius: 12, color: '#991b1b', fontSize: 13, display: 'flex', alignItems: 'center', gap: 10 }}>

// ─── SETTINGS ─────────────────────────────────────────────
function SettingsScreen({ go, pendingSource, updateStore, setActiveSet, apiKey }) {
  const [types, setTypes] = useState([
    { id: 'ox', label: 'OX 문제', desc: '참/거짓 빠르게', icon: 'check', selected: true },
    { id: 'mc', label: '객관식', desc: '4지선다 표준', icon: 'hash', selected: true },
    { id: 'fill', label: '빈칸 채우기', desc: '핵심어 암기', icon: 'edit', selected: true },
    { id: 'short', label: '단답형', desc: '짧은 서술', icon: 'note', selected: false },
  ]);
  const [difficulty, setDifficulty] = useState('med');
  const [count, setCount] = useState(10);
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState(null);
  const [progress, setProgress] = useState(0);

  useEffect(() => { if (!pendingSource) go('upload'); }, []);
  if (!pendingSource) return null;

  const toggleType = (id) => {
    const next = types.map(t => t.id === id ? { ...t, selected: !t.selected } : t);
    if (next.filter(t => t.selected).length === 0) return;
    setTypes(next);
  };

  const generate = async () => {
    setError(null);
    setGenerating(true);
    setProgress(0);
    const progressTimer = setInterval(() => setProgress(p => Math.min(p + Math.random() * 15, 85)), 600);
    try {
      const questions = await generateQuestions({ source: pendingSource.text, types, difficulty, count, apiKey });
      clearInterval(progressTimer);
      setProgress(100);
      if (!questions.length) throw new Error('문제를 생성하지 못했어요. 다시 시도해주세요.');
      const set = { id: 'set-' + Date.now(), title: pendingSource.title, subject: '학습 자료', questions, createdAt: Date.now(), lastAccuracy: null };
      updateStore(s => ({ ...s, sets: [...s.sets, set] }));
      setActiveSet(set);
      showToast(`${questions.length}개의 문제가 생성됐어요!`, 'success');
      setTimeout(() => go('quiz'), 200);
    } catch (e) {
      clearInterval(progressTimer);
      setError('생성 오류: ' + (e.message || '잠시 후 다시 시도해주세요.'));
    } finally {
      setGenerating(false);
      setProgress(0);
    }
  };

  if (generating) {
    return (
      <div className="container" style={{ padding: '80px 20px', textAlign: 'center' }}>
        <div style={{ position: 'relative', width: 80, height: 80, margin: '0 auto 24px' }}>
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(135deg, var(--brand-500), var(--accent-500))', borderRadius: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'white', boxShadow: 'var(--sh-brand)' }}>
            <Ic name="sparkles" size={36} />
          </div>
          <div style={{ position: 'absolute', inset: 0, border: '3px solid var(--brand-300)', borderRadius: 22, animation: 'pulse-ring 1.6s ease-out infinite' }} />
        </div>
        <h2 style={{ fontSize: 22, fontWeight: 800, margin: '0 0 8px', letterSpacing: '-0.02em' }}>AI가 문제를 만들고 있어요</h2>
        <p style={{ fontSize: 14, color: 'var(--ink-500)', margin: '0 0 24px' }}>핵심 개념 분석 후 {count}개의 문제를 생성 중...</p>
        <div style={{ maxWidth: 320, margin: '0 auto' }}>
          <div className="progress"><span style={{ width: progress + '%' }} /></div>
          <div style={{ fontSize: 12, color: 'var(--ink-400)', marginTop: 8 }}>{Math.round(progress)}%</div>
        </div>
      </div>
    );
  }

  return (
    <div className="container" style={{ padding: '32px 20px 80px' }}>
      <Stepper active={2} />
      <div style={{ marginBottom: 20 }}>
        <h1 style={{ fontSize: 24, fontWeight: 800, margin: '0 0 6px', letterSpacing: '-0.025em' }}>문제 설정</h1>
        <p style={{ fontSize: 14, color: 'var(--ink-500)', margin: 0 }}>
          <strong style={{ color: 'var(--ink-800)' }}>{pendingSource.title}</strong>
          {pendingSource.pages ? ` · ${pendingSource.pages}페이지` : ''}
        </p>
      </div>

      {/* Types */}
      <div className="card" style={{ padding: 20, marginBottom: 14 }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, margin: '0 0 14px' }}>문제 유형</h3>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: 10 }}>
          {types.map(t => (
            <div key={t.id} onClick={() => toggleType(t.id)} style={{
              padding: 14, borderRadius: 14, cursor: 'pointer', position: 'relative',
              background: t.selected ? 'linear-gradient(135deg, #f1f4ff 0%, #f6f1ff 100%)' : 'white',
              border: `1.5px solid ${t.selected ? 'var(--brand-500)' : 'var(--ink-100)'}`,
              transition: 'all .15s',
            }}>
              <div style={{ width: 30, height: 30, borderRadius: 9, background: t.selected ? 'white' : 'var(--ink-50)', color: t.selected ? 'var(--brand-600)' : 'var(--ink-500)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 8 }}>
                <Ic name={t.icon} size={15} />
              </div>
              <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 2 }}>{t.label}</div>
              <div style={{ fontSize: 11.5, color: 'var(--ink-500)' }}>{t.desc}</div>
              {t.selected && (
                <div style={{ position: 'absolute', top: 10, right: 10, width: 18, height: 18, borderRadius: 999, background: 'var(--brand-500)', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

      <div className="card" style={{ padding: 20, marginBottom: 14 }}>

          {[{ id: 'easy', label: '쉬움', desc: '개념 확인', emoji: '🌱' }, { id: 'med', label: '보통', desc: '균형있게', emoji: '⚡' }, { id: 'hard', label: '어려움', desc: '응용·심화', emoji: '🔥' }].map(d => (

              <div style={{ fontSize: 22, marginBottom: 4 }}>{d.emoji}</div>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{d.label}</div>
              <div style={{ fontSize: 11, color: difficulty === d.id ? 'rgba(255,255,255,0.6)' : 'var(--ink-500)', marginTop: 2 }}>{d.desc}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Count */}
      <div className="card" style={{ padding: 20, marginBottom: 14 }}>
        <h3 style={{ fontSize: 15, fontWeight: 700, margin: '0 0 14px' }}>문제 개수</h3>

            <button key={n} onClick={() => setCount(n)} style={{ flex: '1 1 70px', minWidth: 70, padding: '14px 0', borderRadius: 12, border: count === n ? '2px solid var(--brand-500)' : '1.5px solid var(--ink-100)', background: count === n ? '#f1f4ff' : 'white', color: count === n ? 'var(--brand-700)' : 'var(--ink-900)', fontSize: 16, fontWeight: 700, transition: 'all .15s' }}>{n}개</button>

// ─── QUIZ ─────────────────────────────────────────────────
function QuizScreen({ set, go, setResults, updateStore }) {
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState(() => set.questions.map(() => ({ given: null, correct: null, submitted: false })));
  const [textInput, setTextInput] = useState('');
  const [startTime] = useState(Date.now);

  const q = set.questions[idx];
  const a = answers[idx];

  useEffect(() => { setTextInput(answers[idx].given || ''); }, [idx]);

  const checkAnswer = (given) => {
    if (q.type === 'mc') {
      const num = String(q.answer).match(/\d/);
      return String(given) === (num ? num[0] : String(q.answer));
    } else if (q.type === 'ox') {
      return given === String(q.answer).toUpperCase();
    } else {
      const norm = (s) => String(s).trim().toLowerCase().replace(/\s+/g, '');
      return norm(given) === norm(q.answer);
    }
  };

  const submit = (given) => {
    if (a.submitted) return;
    const correct = checkAnswer(given);
    const next = answers.slice();
    next[idx] = { given, correct, submitted: true };
    setAnswers(next);
  };

  const finish = (finalAnswers) => {
    const correctCount = finalAnswers.filter(a => a.correct).length;
    const total = finalAnswers.length;
    const accuracy = Math.round((correctCount / total) * 100);
    const timeSpent = Math.round((Date.now() - startTime()) / 1000);
    const newMistakes = [];
    finalAnswers.forEach((ans, i) => {
      if (!ans.correct) newMistakes.push({ id: 'm-' + Date.now() + '-' + i, setId: set.id, setTitle: set.title, question: set.questions[i], given: ans.given, createdAt: Date.now() });
    });
    updateStore(s => ({
      sets: s.sets.map(x => x.id === set.id ? { ...x, lastAccuracy: accuracy } : x),
      mistakes: [...s.mistakes, ...newMistakes],
    }));
    setResults({ correctCount, total, accuracy, timeSpent, answers: finalAnswers });
    go('result');
  };

  const next = () => idx < set.questions.length - 1 ? setIdx(idx + 1) : finish(answers);
  const prev = () => { if (idx > 0) setIdx(idx - 1); };

  return (
    <div style={{ minHeight: '100vh', background: 'linear-gradient(180deg, #f7f8fc 0%, #eef0f6 100%)' }}>
      <div style={{ background: 'white', borderBottom: '1px solid var(--ink-100)' }}>
        <div className="container" style={{ padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 14 }}>
          <button onClick={() => { if (confirm('풀이를 종료하시겠어요? 진행 상황은 저장되지 않아요.')) go('home'); }} style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--ink-50)', border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ink-700)' }}>
            <Ic name="x" size={18} />
          </button>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, color: 'var(--ink-500)', fontWeight: 500, marginBottom: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{set.title}</div>
            <div className="progress" style={{ height: 4 }}><span style={{ width: ((idx + 1) / set.questions.length * 100) + '%' }} /></div>
          </div>
          <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--ink-700)', fontVariantNumeric: 'tabular-nums' }}>
            <span style={{ color: 'var(--brand-600)' }}>{idx + 1}</span>
            <span style={{ color: 'var(--ink-300)' }}>/{set.questions.length}</span>
          </div>
        </div>
      </div>

      <div className="container" style={{ padding: '24px 20px 100px' }}>
        <QuestionCard q={q} a={a} textInput={textInput} setTextInput={setTextInput} onPick={submit} onSubmitText={() => textInput.trim() && submit(textInput.trim())} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 20, gap: 10 }}>
          <button className="btn btn-secondary" onClick={prev} disabled={idx === 0}><Ic name="arrow-left" size={14} stroke={2.2} />이전</button>
          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', justifyContent: 'center', maxWidth: 200 }}>
            {set.questions.map((_, i) => (
              <span key={i} style={{ width: 7, height: 7, borderRadius: 999, cursor: 'pointer', background: answers[i].submitted ? (answers[i].correct ? 'var(--success-500)' : 'var(--error-500)') : (i === idx ? 'var(--brand-500)' : 'var(--ink-200)') }} onClick={() => setIdx(i)} />
            ))}
          </div>
          {a.submitted
            ? <button className="btn btn-primary" onClick={next}>{idx === set.questions.length - 1 ? '결과 보기' : '다음 문제'}<Ic name="arrow-right" size={14} stroke={2.2} /></button>
            : <button className="btn btn-secondary" onClick={() => submit(null)}>건너뛰기</button>
          }
        </div>
      </div>
    </div>
  );
}

function QuestionCard({ q, a, textInput, setTextInput, onPick, onSubmitText }) {
  const typeLabel = { ox: 'OX', mc: '객관식', fill: '빈칸', short: '단답형' }[q.type] || q.type;
  const typeBg = { ox: '#ecfdf5', mc: '#fdf2f8', fill: '#fffbeb', short: '#f1f4ff' }[q.type];
  const typeColor = { ox: '#047857', mc: '#be185d', fill: '#b45309', short: 'var(--brand-700)' }[q.type];

  return (
    <>
      <div className="card" style={{ padding: 24, marginBottom: 14 }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
          <span className="chip" style={{ background: typeBg, color: typeColor }}>{typeLabel}</span>
        </div>
        <h2 style={{ fontSize: 'clamp(17px, 2.4vw, 21px)', fontWeight: 700, lineHeight: 1.55, margin: '0 0 22px', color: 'var(--ink-900)', letterSpacing: '-0.01em', whiteSpace: 'pre-wrap' }}>{q.question}</h2>

        {q.type === 'mc' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {(q.choices || []).map((choice, i) => {
              const num = i + 1;
              const isPicked = a.given === String(num);
              const correctNum = String(q.answer).match(/\d/)?.[0];
              const isCorrect = a.submitted && String(num) === correctNum;
              const isWrongPick = a.submitted && isPicked && !isCorrect;
              let bg = 'white', bd = 'var(--ink-100)', cb = 'var(--ink-50)', cc = 'var(--ink-600)', tc = 'var(--ink-800)';
              if (isCorrect) { bg = '#ecfdf5'; bd = 'var(--success-500)'; cb = 'var(--success-500)'; cc = 'white'; tc = '#047857'; }
              else if (isWrongPick) { bg = '#fef2f2'; bd = 'var(--error-500)'; cb = 'var(--error-500)'; cc = 'white'; tc = '#991b1b'; }
              else if (isPicked && !a.submitted) { bg = '#f1f4ff'; bd = 'var(--brand-500)'; cb = 'var(--brand-500)'; cc = 'white'; tc = 'var(--brand-700)'; }
              return (
                <button key={i} onClick={() => !a.submitted && onPick(String(num))} disabled={a.submitted} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', borderRadius: 14, border: `1.5px solid ${bd}`, background: bg, width: '100%', textAlign: 'left', cursor: a.submitted ? 'default' : 'pointer', transition: 'all .1s' }}>
                  <div style={{ width: 28, height: 28, borderRadius: 999, background: cb, color: cc, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700, flexShrink: 0 }}>
                    {isCorrect ? <Ic name="check" size={14} stroke={3} /> : isWrongPick ? <Ic name="x" size={14} stroke={3} /> : ['①','②','③','④','⑤'][i]}
                  </div>
                  <span style={{ fontSize: 14.5, color: tc, fontWeight: (isCorrect || isWrongPick || isPicked) ? 600 : 500, flex: 1, lineHeight: 1.45 }}>
                    {String(choice).replace(/^[①-⑤\d.\s)]+\s*/, '')}
                  </span>
                </button>
              );
            })}
          </div>
        )}

        {q.type === 'ox' && (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
            {['O', 'X'].map(opt => {
              const isPicked = a.given === opt;
              const correctAns = String(q.answer).toUpperCase();
              const isCorrect = a.submitted && opt === correctAns;
              const isWrongPick = a.submitted && isPicked && !isCorrect;
              let bg = 'white', bd = 'var(--ink-100)', tc = 'var(--ink-700)';
              if (isCorrect) { bg = '#ecfdf5'; bd = 'var(--success-500)'; tc = '#047857'; }
              else if (isWrongPick) { bg = '#fef2f2'; bd = 'var(--error-500)'; tc = '#991b1b'; }
              else if (isPicked && !a.submitted) { bg = '#f1f4ff'; bd = 'var(--brand-500)'; tc = 'var(--brand-700)'; }
              return (
                <button key={opt} onClick={() => !a.submitted && onPick(opt)} disabled={a.submitted} style={{ padding: '32px 0', borderRadius: 16, border: `2px solid ${bd}`, background: bg, color: tc, fontSize: 48, fontWeight: 800, fontFamily: 'var(--font-display)', letterSpacing: '-0.04em', cursor: a.submitted ? 'default' : 'pointer', transition: 'all .1s' }}>{opt}</button>
              );
            })}
          </div>
        )}

        {(q.type === 'fill' || q.type === 'short') && (
          <div>
            <input className="input" placeholder={q.type === 'fill' ? '빈칸에 들어갈 답을 입력하세요' : '답을 입력하세요'} value={textInput} onChange={(e) => setTextInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && !a.submitted && onSubmitText()} disabled={a.submitted} style={{ fontSize: 15, padding: '14px 16px' }} />
            {!a.submitted && <button className="btn btn-primary btn-block" onClick={onSubmitText} disabled={!textInput.trim()} style={{ marginTop: 10 }}>정답 확인</button>}
          </div>
        )}
      </div>

      {a.submitted && (
        <div className="pop" style={{ background: a.correct ? 'linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%)' : 'linear-gradient(135deg, #fef2f2 0%, #fff5f5 100%)', border: `1px solid ${a.correct ? '#a7f3d0' : '#fecaca'}`, borderRadius: 18, padding: 18, display: 'flex', gap: 12 }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: a.correct ? 'var(--success-500)' : 'var(--error-500)', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Ic name={a.correct ? 'check' : 'x'} size={20} stroke={2.5} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: a.correct ? '#065f46' : '#991b1b', marginBottom: 4 }}>
              {a.correct ? '정답입니다!' : '아쉬워요. 정답: ' + q.answer}
            </div>
            <p style={{ fontSize: 13, color: 'var(--ink-700)', lineHeight: 1.6, margin: 0 }}>{q.explanation}</p>
          </div>
        </div>
      )}
    </>
  );
}

// ─── RESULT ───────────────────────────────────────────────
function ResultScreen({ results, set, go }) {
  const { correctCount, total, accuracy, timeSpent } = results;
  const mins = Math.floor(timeSpent / 60), secs = timeSpent % 60;
  const grade = accuracy >= 90 ? 'A+' : accuracy >= 80 ? 'A' : accuracy >= 70 ? 'B' : accuracy >= 60 ? 'C' : 'D';
  const emoji = accuracy >= 80 ? '🎉' : accuracy >= 60 ? '👍' : '💪';

  return (
    <div style={{ minHeight: '100vh', background: 'linear-gradient(180deg, #f7f8fc 0%, #eef0f6 100%)' }}>
      <div className="container" style={{ padding: '40px 20px 80px', maxWidth: 720 }}>
        <div style={{ textAlign: 'center', marginBottom: 24 }}>
          <div style={{ fontSize: 32, marginBottom: 6 }}>{emoji}</div>
          <h1 style={{ fontSize: 28, fontWeight: 800, margin: 0, letterSpacing: '-0.025em' }}>
            {accuracy >= 80 ? '훌륭해요!' : accuracy >= 60 ? '잘 했어요!' : '다시 한번 도전!'}
          </h1>
          <p style={{ fontSize: 14, color: 'var(--ink-500)', margin: '6px 0 0' }}>{set.title}</p>
        </div>

        <div style={{ background: 'linear-gradient(135deg, #4a55f0 0%, #7250e8 100%)', borderRadius: 24, padding: 28, color: 'white', marginBottom: 14, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: -50, right: -50, width: 200, height: 200, background: 'rgba(255,255,255,0.07)', borderRadius: '50%' }} />
          <div style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 24, flexWrap: 'wrap' }}>
            <div style={{ position: 'relative', width: 140, height: 140, flexShrink: 0 }}>
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,0.18)" strokeWidth="11" />
                <circle cx="70" cy="70" r="60" fill="none" stroke="white" strokeWidth="11"
                  strokeDasharray={2 * Math.PI * 60}
                  strokeDashoffset={2 * Math.PI * 60 * (1 - accuracy / 100)}
                  strokeLinecap="round" transform="rotate(-90 70 70)" />
              </svg>
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ fontSize: 11, opacity: 0.8 }}>정답률</div>
                <div style={{ fontFamily: 'var(--font-display)', fontSize: 38, fontWeight: 800, letterSpacing: '-0.03em', lineHeight: 1 }}>{accuracy}<span style={{ fontSize: 18, opacity: 0.7 }}>%</span></div>
              </div>
            </div>
            <div style={{ flex: 1, minWidth: 140 }}>
              <div style={{ fontSize: 12, opacity: 0.85, marginBottom: 4 }}>등급</div>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 56, fontWeight: 800, letterSpacing: '-0.03em', lineHeight: 1, marginBottom: 12 }}>{grade}</div>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: 'rgba(255,255,255,0.18)', padding: '6px 12px', borderRadius: 999, fontSize: 12, fontWeight: 600 }}>
                <Ic name="trophy" size={13} />{correctCount} / {total}문제 정답
              </div>
            </div>
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10, marginBottom: 24 }}>
          {[
            { label: '맞힘', v: correctCount, c: 'var(--success-600)', bg: '#ecfdf5', icon: 'check' },
            { label: '틀림', v: total - correctCount, c: 'var(--error-600)', bg: '#fef2f2', icon: 'x' },
            { label: '시간', v: `${mins}:${String(secs).padStart(2, '0')}`, c: 'var(--brand-600)', bg: '#f1f4ff', icon: 'clock' },
          ].map((s, i) => (
            <div key={i} className="card" style={{ padding: 14, textAlign: 'center' }}>
              <div style={{ width: 30, height: 30, borderRadius: 8, background: s.bg, color: s.c, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 8px' }}>
                <Ic name={s.icon} size={15} stroke={2.2} />
              </div>
              <div style={{ fontSize: 11, color: 'var(--ink-500)', marginBottom: 2 }}>{s.label}</div>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 20, fontWeight: 800, color: 'var(--ink-900)', letterSpacing: '-0.02em' }}>{s.v}</div>
            </div>
          ))}
        </div>

        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn btn-secondary btn-lg" onClick={() => go('mistakes')} style={{ flex: '1 1 140px' }}><Ic name="note" size={16} />오답노트</button>
          <button className="btn btn-secondary btn-lg" onClick={() => go('home')} style={{ flex: '1 1 140px' }}><Ic name="home" size={16} />홈으로</button>
          <button className="btn btn-primary btn-lg" onClick={() => go('upload')} style={{ flex: '1 1 200px' }}><Ic name="plus" size={16} stroke={2.4} />새 문제 만들기</button>
        </div>
      </div>
    </div>
  );
}

// ─── MISTAKES ─────────────────────────────────────────────
function MistakesScreen({ store, updateStore, go }) {
  const [filter, setFilter] = useState('all');

  const setTitles = useMemo(() => {
    const m = {};
    store.mistakes.forEach(x => { m[x.setId] = x.setTitle; });
    return m;
  }, [store.mistakes]);

  const filtered = filter === 'all' ? store.mistakes : store.mistakes.filter(m => m.setId === filter);

  const removeMistake = (id) => {
    if (!confirm('이 오답을 삭제할까요?')) return;
    updateStore(s => ({ ...s, mistakes: s.mistakes.filter(m => m.id !== id) }));
  };

  const clearAll = () => {
    if (!confirm('모든 오답을 삭제할까요?')) return;
    updateStore(s => ({ ...s, mistakes: [] }));
  };

  return (
    <div className="container" style={{ padding: '32px 20px 80px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 18, gap: 10, flexWrap: 'wrap' }}>
        <div>
          <h1 style={{ fontSize: 26, fontWeight: 800, margin: '0 0 6px', letterSpacing: '-0.025em' }}>오답노트</h1>
          <p style={{ fontSize: 14, color: 'var(--ink-500)', margin: 0 }}>틀린 문제를 다시 확인하고 약점을 줄여보세요</p>
        </div>
        {store.mistakes.length > 0 && (
          <button className="btn btn-ghost btn-sm" onClick={clearAll} style={{ color: 'var(--error-600)' }}>
            <Ic name="trash" size={14} />모두 삭제
          </button>
        )}
      </div>

      {store.mistakes.length === 0 ? (
        <div className="card" style={{ padding: 56, textAlign: 'center' }}>
          <div style={{ width: 64, height: 64, margin: '0 auto 16px', background: 'var(--ink-50)', color: 'var(--ink-400)', borderRadius: 18, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Ic name="note" size={28} />
          </div>
          <h2 style={{ fontSize: 18, fontWeight: 700, margin: '0 0 6px' }}>아직 오답이 없어요</h2>
          <p style={{ fontSize: 13.5, color: 'var(--ink-500)', margin: '0 0 16px' }}>문제를 풀면 틀린 문제가 자동으로 모입니다.</p>
          <button className="btn btn-primary" onClick={() => go('upload')}><Ic name="plus" size={14} stroke={2.4} />문제 만들기</button>
        </div>
      ) : (
        <>
          <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
            <FilterChip active={filter === 'all'} count={store.mistakes.length} onClick={() => setFilter('all')}>전체</FilterChip>
            {Object.entries(setTitles).map(([id, title]) => {
              const n = store.mistakes.filter(m => m.setId === id).length;
              return <FilterChip key={id} active={filter === id} count={n} onClick={() => setFilter(id)}>{title.length > 18 ? title.slice(0, 18) + '...' : title}</FilterChip>;
            })}
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {filtered.slice().reverse().map(m => <MistakeCard key={m.id} m={m} onRemove={() => removeMistake(m.id)} />)}
          </div>
        </>
      )}
    </div>
  );
}

function FilterChip({ active, count, onClick, children }) {
  return (
    <button onClick={onClick} style={{ padding: '7px 14px', borderRadius: 999, background: active ? 'var(--ink-900)' : 'white', color: active ? 'white' : 'var(--ink-700)', border: active ? 'none' : '1px solid var(--ink-200)', fontSize: 12.5, fontWeight: 600, display: 'flex', gap: 6, alignItems: 'center' }}>
      {children}
      <span style={{ background: active ? 'rgba(255,255,255,0.2)' : 'var(--ink-100)', color: active ? 'white' : 'var(--ink-500)', padding: '0 6px', borderRadius: 999, fontSize: 11 }}>{count}</span>
    </button>
  );
}

function MistakeCard({ m, onRemove }) {
  const typeLabel = { ox: 'OX', mc: '객관식', fill: '빈칸', short: '단답형' }[m.question.type] || m.question.type;
  const date = new Date(m.createdAt);
  const dateStr = `${date.getMonth()+1}/${date.getDate()}`;

  return (
    <div className="card" style={{ padding: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12, gap: 8 }}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
          <span className="chip" style={{ background: 'var(--ink-50)', color: 'var(--ink-700)', fontSize: 11 }}>{typeLabel}</span>
          <span style={{ fontSize: 11.5, color: 'var(--ink-500)' }}>{m.setTitle}</span>
          <span style={{ fontSize: 11, color: 'var(--ink-400)' }}>· {dateStr}</span>
        </div>
        <button onClick={onRemove} style={{ width: 32, height: 32, borderRadius: 8, background: 'transparent', border: 'none', color: 'var(--ink-400)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Ic name="trash" size={15} />
        </button>
      </div>
      <div style={{ fontSize: 14.5, fontWeight: 600, color: 'var(--ink-900)', lineHeight: 1.55, marginBottom: 14, letterSpacing: '-0.01em', whiteSpace: 'pre-wrap' }}>Q. {m.question.question}</div>
      {m.question.type === 'mc' && m.question.choices && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
          {m.question.choices.map((c, i) => {
            const num = i + 1;
            const correctNum = String(m.question.answer).match(/\d/)?.[0];
            const isCorrect = String(num) === correctNum;
            return (
              <div key={i} style={{ padding: '8px 12px', background: isCorrect ? '#ecfdf5' : 'var(--ink-50)', borderRadius: 8, fontSize: 12.5, color: isCorrect ? '#047857' : 'var(--ink-700)', fontWeight: isCorrect ? 600 : 500, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontWeight: 700 }}>{['①','②','③','④','⑤'][i]}</span>
                <span style={{ flex: 1 }}>{String(c).replace(/^[①-⑤\d.\s)]+\s*/, '')}</span>
                {isCorrect && <Ic name="check" size={13} stroke={2.5} />}
              </div>
            );
          })}
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 12 }}>
        <div style={{ padding: '10px 12px', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: 10 }}>
          <div style={{ fontSize: 10.5, color: '#991b1b', fontWeight: 600, marginBottom: 3, display: 'flex', alignItems: 'center', gap: 3 }}><Ic name="x" size={10} stroke={3} />내 답</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-800)', fontWeight: 500, textDecoration: 'line-through', textDecorationColor: 'rgba(239,68,68,0.5)' }}>{m.given || '(미응답)'}</div>
        </div>
        <div style={{ padding: '10px 12px', background: '#ecfdf5', border: '1px solid #a7f3d0', borderRadius: 10 }}>
          <div style={{ fontSize: 10.5, color: '#065f46', fontWeight: 600, marginBottom: 3, display: 'flex', alignItems: 'center', gap: 3 }}><Ic name="check" size={10} stroke={3} />정답</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-900)', fontWeight: 600 }}>{m.question.answer}</div>
        </div>
      </div>
      <div style={{ background: 'var(--ink-50)', borderRadius: 10, padding: '10px 12px', display: 'flex', gap: 8 }}>
        <Ic name="sparkles" size={13} style={{ color: 'var(--brand-500)', flexShrink: 0, marginTop: 2 }} />
        <div style={{ fontSize: 12.5, color: 'var(--ink-700)', lineHeight: 1.55 }}>
          <strong style={{ color: 'var(--ink-900)' }}>해설 </strong>{m.question.explanation}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
